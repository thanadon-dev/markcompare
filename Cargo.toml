[package]
name = "markcompare"
version = "0.2.0"
edition = "2021"
description = "Side-by-side folder and file diff that opens in your browser"
license = "MIT"
repository = "https://github.com/thanadon-dev/markcompare"

[dependencies]
similar = "2"
tiny_http = "0.12"
rfd = "0.15"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
